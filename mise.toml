# Verified preview 22 SDK assets; keep checksums and version together.
[tools."github:17robots/dyn"]
version = "0.1.0-preview.22"
prerelease = true
strip_components = 1
bin_path = "bin"
[tools."github:17robots/dyn".platforms]
linux-x64 = { asset_pattern = "dyn-0.1.0-preview.22-linux-x86_64-glibc2.39.tar.gz", checksum = "sha256:07c5c9696b8c53dfbb17b3848a05926fb5747918f4c453a6260fddec14892b8e" }
macos-arm64 = { asset_pattern = "dyn-0.1.0-preview.22-macos-aarch64.tar.gz", checksum = "sha256:c2e4c389fff0bea986d66acb78d15ab1efce3fe864188e4a0dc133d22366cc60" }
windows-x64 = { asset_pattern = "dyn-0.1.0-preview.22-windows-x86_64.zip", checksum = "sha256:d6ee12099124a5ab840669e110351b8f425a6f620910869f6648950bba9656c2" }

# Dependencies remain local; run `just deps` once after cloning.
[env]
# build/deps/static comes first: `dyn build src` and `dyn run src` link SDL3,
# SDL_ttf and the DNA native library statically, so the binary runs from any
# directory without these libraries installed.
DYN_LIBRARY_PATH = "{{config_root}}/build/deps/static:{{config_root}}/build/deps/install/lib"
LD_LIBRARY_PATH = "{{config_root}}/build/deps/install/lib"
