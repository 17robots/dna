# Verified preview 37 SDK assets; keep checksums and version together.
[tools."github:17robots/dyn"]
version = "0.1.0-preview.37"
prerelease = true
strip_components = 1
bin_path = "bin"
[tools."github:17robots/dyn".platforms]
linux-x64 = { asset_pattern = "dyn-0.1.0-preview.37-linux-x86_64-glibc2.39.tar.gz", checksum = "sha256:1a620ba18b313b4dbec5ee0854d760288369f1d027bde2209d618bafaedcf407" }
macos-arm64 = { asset_pattern = "dyn-0.1.0-preview.37-macos-aarch64.tar.gz", checksum = "sha256:d335f09286b9475bac1f0e7012d8e89f8ff8b4169804fd9d421a0dd4e92c606b" }
windows-x64 = { asset_pattern = "dyn-0.1.0-preview.37-windows-x86_64.zip", checksum = "sha256:a2b687ff98114960f178a3f41f926293120d68f4f92c7578f2e2ec5f2b82d490" }
# Windows on ARM runs the x64 compiler under emulation; DNA_WINDOWS_TARGET
# selects ARM64 output (scripts/windows_target.py).
windows-arm64 = { asset_pattern = "dyn-0.1.0-preview.37-windows-x86_64.zip", checksum = "sha256:a2b687ff98114960f178a3f41f926293120d68f4f92c7578f2e2ec5f2b82d490" }

# Dependencies remain local; run `just deps` once after cloning.
[env]
# Native support archive first; system graphics/text and the SDK window bridge
# remain shared. No SDL dependency is built or linked.
DYN_LIBRARY_PATH = "{{config_root}}/build/deps/static:{{config_root}}/build/deps/install/lib"
LD_LIBRARY_PATH = "{{config_root}}/build/deps/install/lib"
