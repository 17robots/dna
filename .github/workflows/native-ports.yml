name: Native port foundations
on:
  push:
    branches: [main, 'port/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dna-native-ports-${{ github.ref }}
  cancel-in-progress: true
jobs:
  host-adapters:
    name: Host adapters (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Stage the pinned SDK configuration without Linux library paths
        run: |
          python - <<'PY'
          from pathlib import Path
          configuration = Path('mise.toml').read_text().split('[env]', 1)[0]
          stage = Path('build/native-sdk')
          stage.mkdir(parents=True, exist_ok=True)
          (stage / 'mise.toml').write_text(configuration)
          PY
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          version: '2026.9.9'
          working_directory: build/native-sdk
          cache: false
      - name: Run debug and release host adapters in a Unicode directory
        working-directory: build/native-sdk
        run: |
          mise exec -- python ../../scripts/test_host.py
          mise exec -- python ../../scripts/test_host.py filesystem
