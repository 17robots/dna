# Verified preview 41 SDK assets; keep checksums and version together.
[tools."github:17robots/dyn"]
version = "0.1.0-preview.41"
prerelease = true
strip_components = 1
bin_path = "bin"
[tools."github:17robots/dyn".platforms]
linux-x64 = { asset_pattern = "dyn-0.1.0-preview.41-linux-x86_64-glibc2.39.tar.gz", checksum = "sha256:e2e69d1c6bce16e77708a927f334881a6907f4afcf837bc3f73404fcfec06e61" }
macos-arm64 = { asset_pattern = "dyn-0.1.0-preview.41-macos-aarch64.tar.gz", checksum = "sha256:195f806b332a96d647264cc542d48b5a07e7309bd1942c4fbb6855dcfd14ff26" }
windows-x64 = { asset_pattern = "dyn-0.1.0-preview.41-windows-x86_64.zip", checksum = "sha256:fae8f010e10c062abcbff324a8d19aa3c750cfb272b8e0a1949f5c0fd37c56f8" }
# Windows on ARM runs the x64 compiler under emulation; DNA_WINDOWS_TARGET
# selects ARM64 output (scripts/windows_target.py).
windows-arm64 = { asset_pattern = "dyn-0.1.0-preview.41-windows-x86_64.zip", checksum = "sha256:fae8f010e10c062abcbff324a8d19aa3c750cfb272b8e0a1949f5c0fd37c56f8" }

# Dependencies remain local; run `just deps` once after cloning.
[env]
# Native support archive first; system graphics/text and the SDK window bridge
# remain shared. No SDL dependency is built or linked.
DYN_LIBRARY_PATH = "{{config_root}}/build/deps/static:{{config_root}}/build/deps/install/lib"
LD_LIBRARY_PATH = "{{config_root}}/build/deps/install/lib"
