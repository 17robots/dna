# Verified preview 44 SDK assets; keep checksums and version together.
[tools."github:17robots/dyn"]
version = "0.1.0-preview.44"
prerelease = true
strip_components = 1
bin_path = "bin"
[tools."github:17robots/dyn".platforms]
linux-x64 = { asset_pattern = "dyn-0.1.0-preview.44-linux-x86_64-glibc2.39.tar.gz", checksum = "sha256:6fb1361e39f5cc2004b0b3741934b5e9225af3ddb6b88c613cf9a50393a9b384" }
macos-arm64 = { asset_pattern = "dyn-0.1.0-preview.44-macos-aarch64.tar.gz", checksum = "sha256:0d1cc29df7a49773780636c87a364e1d75a753d7e377bdf654f6fc3fcca3647a" }
windows-x64 = { asset_pattern = "dyn-0.1.0-preview.44-windows-x86_64.zip", checksum = "sha256:c11de41ec9faaa99a28a14bb9b5eb94571a784d6750bf8ead5c3dc6ccbc8b12d" }
# Windows on ARM runs the x64 compiler under emulation; DNA_WINDOWS_TARGET
# selects ARM64 output (scripts/windows_target.py).
windows-arm64 = { asset_pattern = "dyn-0.1.0-preview.44-windows-x86_64.zip", checksum = "sha256:c11de41ec9faaa99a28a14bb9b5eb94571a784d6750bf8ead5c3dc6ccbc8b12d" }

# Dependencies remain local; run `just deps` once after cloning.
[env]
# Native support archive first; system graphics/text and the SDK window bridge
# remain shared. No SDL dependency is built or linked.
DYN_LIBRARY_PATH = "{{config_root}}/build/deps/static:{{config_root}}/build/deps/install/lib"
LD_LIBRARY_PATH = "{{config_root}}/build/deps/install/lib"
