name: Native port foundations
on:
  push:
    branches: [main, 'port/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dna-native-ports-${{ github.ref }}
  cancel-in-progress: true
jobs:
  host-adapters:
    name: Host adapters (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Stage the pinned SDK configuration without Linux library paths
        run: |
          python - <<'PY'
          from pathlib import Path
          configuration = Path('mise.toml').read_text().split('[env]', 1)[0]
          stage = Path('build/native-sdk')
          stage.mkdir(parents=True, exist_ok=True)
          (stage / 'mise.toml').write_text(configuration)
          PY
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          version: '2026.9.9'
          working_directory: build/native-sdk
          cache: false
      - name: Install native buffer dependency
        if: runner.os == 'macOS'
        run: |
          brew install pkgconf utf8proc libvterm tree-sitter pcre2 harfbuzz fribidi freetype coreutils gnu-tar
          brew install --cask font-dejavu-sans-mono-nerd-font
      - name: Run debug and release host adapters in a Unicode directory
        env:
          DNA_TEST_REQUIRE_APFS: ${{ runner.os == 'macOS' && '1' || '0' }}
        working-directory: build/native-sdk
        run: |
          mise exec -- python ../../scripts/test_host.py
          mise exec -- python ../../scripts/test_host.py filesystem
          mise exec -- python ../../scripts/test_host.py threads
          mise exec -- python ../../scripts/test_host.py bulk_memory
          if [ "$RUNNER_OS" = "macOS" ]; then
            mise exec -- python ../../scripts/test_host.py clone
            mise exec -- python ../../tests/native_desktop.py
          fi

      - name: Build and exercise full native Cocoa editor
        if: runner.os == 'macOS'
        working-directory: build/native-sdk
        run: |
          mise exec -- python ../../tests/native_macos.py

      - name: Qualify native Windows I/O
        if: runner.os == 'Windows' && !cancelled()
        working-directory: build/native-sdk
        run: mise exec -- python ../../tests/rec_io_windows.py
      - name: Qualify native Windows process ownership
        if: runner.os == 'Windows' && !cancelled()
        working-directory: build/native-sdk
        run: mise exec -- python ../../tests/process_windows.py
      - name: Qualify native Windows readiness
        if: runner.os == 'Windows' && !cancelled()
        working-directory: build/native-sdk
        run: mise exec -- python ../../tests/notify_windows.py
      - name: Qualify native Windows relative filesystem access
        if: runner.os == 'Windows' && !cancelled()
        working-directory: build/native-sdk
        run: mise exec -- python ../../tests/install_windows.py
      - name: Qualify native Windows ConPTY lifecycle
        if: runner.os == 'Windows' && !cancelled()
        working-directory: build/native-sdk
        run: mise exec -- python ../../tests/pty_windows.py
      - name: Qualify native Windows module paths
        if: runner.os == 'Windows' && !cancelled()
        working-directory: build/native-sdk
        run: mise exec -- python ../../tests/loader_windows.py
      - name: Qualify native Windows console lifecycle
        if: runner.os == 'Windows' && !cancelled()
        working-directory: build/native-sdk
        run: mise exec -- python ../../tests/tty_windows.py
      - name: Qualify native Windows directory notifications
        if: runner.os == 'Windows' && !cancelled()
        working-directory: build/native-sdk
        run: mise exec -- python ../../tests/disk_windows.py
      - name: Qualify native Windows recovery persistence
        if: runner.os == 'Windows' && !cancelled()
        working-directory: build/native-sdk
        run: mise exec -- python ../../tests/recovery_windows.py
      - name: Qualify native Windows private executable files
        if: runner.os == 'Windows' && !cancelled()
        working-directory: build/native-sdk
        run: mise exec -- python ../../tests/private_executable_windows.py
      - name: Qualify native Windows managed plugin publication
        if: runner.os == 'Windows' && !cancelled()
        working-directory: build/native-sdk
        run: mise exec -- python ../../tests/plugin_versions_windows.py
      - name: Qualify native Windows frontend environment and clocks
        if: runner.os == 'Windows' && !cancelled()
        working-directory: build/native-sdk
        run: mise exec -- python ../../tests/frontend_windows.py
      - name: Qualify native Windows file parent paths
        if: runner.os == 'Windows' && !cancelled()
        working-directory: build/native-sdk
        run: mise exec -- python ../../tests/file_paths_windows.py
      - name: Qualify native Windows language version pointers
        if: runner.os == 'Windows' && !cancelled()
        working-directory: build/native-sdk
        run: mise exec -- python ../../tests/language_versions_windows.py
      - name: Install native Windows editor providers
        if: runner.os == 'Windows' && !cancelled()
        id: msys2
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2
        with:
          msystem: UCRT64
          update: true
          path-type: inherit
          install: >-
            curl tar gzip coreutils gawk
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-libvterm
            mingw-w64-ucrt-x86_64-libtree-sitter
            mingw-w64-ucrt-x86_64-pcre2
            mingw-w64-ucrt-x86_64-libutf8proc
            mingw-w64-ucrt-x86_64-harfbuzz
            mingw-w64-ucrt-x86_64-fribidi
            mingw-w64-ucrt-x86_64-freetype
            mingw-w64-ucrt-x86_64-mesa
      - name: Build and exercise full native Win32 editor
        if: runner.os == 'Windows' && !cancelled() && steps.msys2.outcome == 'success'
        env:
          DNA_WINDOWS_PREFIX: ${{ steps.msys2.outputs.msys2-location }}/ucrt64
          LIBGL_ALWAYS_SOFTWARE: 'true'
          GALLIUM_DRIVER: llvmpipe
        working-directory: build/native-sdk
        run: mise exec -- python ../../tests/native_windows.py
      - name: Qualify native Windows installer workflows
        if: runner.os == 'Windows' && !cancelled() && steps.msys2.outcome == 'success'
        env:
          DNA_WINDOWS_PREFIX: ${{ steps.msys2.outputs.msys2-location }}/ucrt64
        working-directory: build/native-sdk
        run: mise exec -- python ../../tests/installer_windows.py
      - name: Qualify native Windows grammar and language-server workflows
        if: runner.os == 'Windows' && !cancelled() && steps.msys2.outcome == 'success'
        env:
          DNA_WINDOWS_PREFIX: ${{ steps.msys2.outputs.msys2-location }}/ucrt64
        working-directory: build/native-sdk
        run: mise exec -- python ../../tests/installer_workflow_windows.py
      - name: Retain failed native Windows link outputs
        if: runner.os == 'Windows' && failure() && steps.msys2.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-native-failure
          retention-days: 3
          if-no-files-found: ignore
          path: |
            build/deps/install/lib/dna_native.dll
            build/deps/install/lib/dna_native.dll.a
            build/deps/install/lib/dyn_window.dll
            build/deps/install/lib/dna-runtime.json
