# Copy to ~/.config/dna/config.toml (or set DNA_CONFIG).
# Flat keys remain supported. Sections below group related settings.
# Strings are literal values: escapes and inline comments are not supported.
# Keys a project dna.toml may not change, also refusing in-editor changes.
# Names are keys, sections, or section.key: lock = ["theme", "languages"].
# lock = []
theme = "light"
# Or: theme = "~/.config/dna/themes/my-theme.toml"
# fallback_font = "/path/to/unicode-font.ttf"
font_size = 16
line_height = 1.25
# font = "/path/to/monospace.ttf"
# shell = "/bin/bash"
indent_width = 2
line_numbers = true
relative_numbers = true
status_line = false
highlight_line = true
reduced_motion = false
explorer_icons = true
explorer_columns = true
explorer_preview = false
terminal_escape = "ctrl-backslash"

# Optional overrides: values are palette commands, not executable config code.
# build_command = "dyn build src"
# test_command = "just test"
# run_command = "dyn run src"
[keys.normal]
"f2" = "terminal"
[keys.space]
"t" = "terminal"

[editor]
# Space around document text.
padding = 18
# Lines retained above and below the cursor.
scroll_margin = 3
# Columns retained beside the cursor.
horizontal_scroll_margin = 2
# Insert a tab instead of spaces with Tab.
insert_tabs = false

[cursor]
# Cursor transition duration; zero disables animation.
animation_ms = 50
# Bar and underline thickness in logical pixels.
thickness = 2
# Animate cursor movement.
smooth = true
# Neovide-style trail on cursor jumps; leading edges arrive first. Zero disables it.
trail_size = 1

[scroll]
# Scroll transition duration; zero disables animation.
animation_ms = 50
# Animate scrolling.
smooth = true

[popups]
# Popup fade duration; zero disables animation.
animation_ms = 50
# Command and message popup width fraction.
width = 0.64
# Maximum dialog height fraction; longer content scrolls.
height = 0.56
# Inner padding for compact popups.
padding = 10
# Animate popup visibility.
transitions = true

[layout]
# Keep panes evenly sized when splitting or closing (two panes take halves,
# three take thirds); false uses split_ratio for new splits.
equalize_splits = true
# First pane fraction for new splits when equalize_splits is false.
split_ratio = 0.5

[picker]
# Show file and buffer previews when space permits.
preview = true

[recovery]
# Minimum delay between recovery snapshots.
interval_ms = 500
# Write automatic crash-recovery snapshots.
enabled = true

[lsp]
# Start a language's default server (rust-analyzer, gopls, zls, clangd...)
# when it is on PATH and none is configured.
default_servers = true
# Suggestions appear after a typing pause and keep accepting typed text.
automatic_completion = true
completion_delay_ms = 25
# Language-server request and startup deadline.
timeout_ms = 10000
# Delay before synchronizing changed documents.
change_delay_ms = 50

[plugins]
# Plugin initialization and command deadline.
timeout_ms = 5000

[performance]
# Minimum interval between animated frames; frames otherwise follow the display refresh.
frame_interval_ms = 4

[mouse]
# Allow mouse selection and pane focus.
enabled = false

[highlighting]
# Enable Tree-sitter highlighting.
enabled = true

[files]
reload_config = true
# Reload clean buffers after external changes.
reload_clean = true
# Ensure a final newline when saving nonempty files.
final_newline = false
# Remove trailing spaces and tabs on save.
trim_trailing_whitespace = true

# Configure only tools you have chosen to install. Commands run in the editor's
# current directory. Formatters receive UTF-8 text on stdin and return it on stdout.
# Dyn starts its built-in LSP automatically; set auto_start=false to disable.
# [languages.dyn]
# indent_width = 2
# insert_tabs = false
# extensions = ".dyn"
# server = "dyn lsp"
# auto_start = true
# formatter = "your-formatter --stdin"
# format_on_save = false

[modules]
# Keymap: helix or vim (Vim: operator then motion, visual modes, . repeat,
# registers, macros, :s; README "Vim keys" lists them). Frontend: auto, gui or tui
# (auto runs in the terminal only without a display; --tui/--gui override it).
# Explorer: buffer or tree. Picker: full, compact or dropdown.
# :modules lists what this build includes; :module explorer tree switches.
keymap = "helix"
frontend = "auto"

# Placement of palette, picker, menu, dialog, explorer, terminal, completion
# and hover. anchor floats it (top-left ... bottom-right); side docks it and the
# panes make room. Sizes: 0-1 fraction of the window, above 1 logical pixels.
# [place.picker]
# anchor = "top-right"
# width = 0.45
# height = 0.6
# [place.explorer]
# side = "left"
# size = 0.25

# Personal project overrides belong in this global file, not dna.toml.
# Matching sections apply in file order; only top-level settings are allowed.
# [project."~/work/example"]
# theme = "nord"
# font_size = 16
# indent_width = 2
