name: Linux checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dna-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  linux:
    runs-on: ubuntu-latest
    container: archlinux:base
    timeout-minutes: 30
    steps:
      - name: Install build dependencies
        run: pacman -Syu --noconfirm --needed base-devel bubblewrap desktop-file-utils git curl python cmake ninja clang llvm lld just libvterm tree-sitter fontconfig pcre2 libutf8proc ttf-dejavu libxi libxrandr libxss libxtst wayland-protocols harfbuzz fribidi freetype2 weston niri libxkbcommon mesa alsa-lib
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install pinned Dyn compiler
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 https://github.com/17robots/dyn/releases/download/v0.1.0-preview.30/dyn-0.1.0-preview.30-linux-x86_64-glibc2.39.tar.gz -o /tmp/dyn.tar.gz
          echo '63ef3d2891dfae77c3ecc5b5cfe03c11980c4d6163ad05b19a8770ede70fbdaf  /tmp/dyn.tar.gz' | sha256sum --check
          mkdir -p /opt/dyn
          tar -xzf /tmp/dyn.tar.gz --strip-components=1 -C /opt/dyn
          echo /opt/dyn/bin >> "$GITHUB_PATH"
      - name: Start isolated native Wayland display
        shell: bash
        run: |
          set -euo pipefail
          export XDG_RUNTIME_DIR="$(mktemp -d)"
          chmod 700 "$XDG_RUNTIME_DIR"
          export WAYLAND_DISPLAY=dna-ci
          weston --backend=headless --renderer=pixman --socket="$WAYLAND_DISPLAY" --idle-time=0 --log=/tmp/dna-weston.log &
          for attempt in {1..100}; do
            if [ -S "$XDG_RUNTIME_DIR/$WAYLAND_DISPLAY" ]; then break; fi
            sleep 0.1
          done
          test -S "$XDG_RUNTIME_DIR/$WAYLAND_DISPLAY" || { cat /tmp/dna-weston.log; exit 1; }
          echo "XDG_RUNTIME_DIR=$XDG_RUNTIME_DIR" >> "$GITHUB_ENV"
          echo "WAYLAND_DISPLAY=$WAYLAND_DISPLAY" >> "$GITHUB_ENV"
          echo "DNA_SMOKE_TIMEOUT_SECONDS=90" >> "$GITHUB_ENV"
      - name: Formatting
        run: just fmt-check
      - name: Test editor and native boundaries
        run: just smoke
      - name: Extended resource and editing soak
        if: github.event_name == 'workflow_dispatch'
        run: just soak
      - name: Verify relocatable deterministic package
        run: python3 tests/package.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dna-preview-linux-x86_64
          path: build/packages/dna-preview-linux-x86_64.tar.gz
          if-no-files-found: error
