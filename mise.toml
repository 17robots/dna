# Verified preview 39 SDK assets; keep checksums and version together.
[tools."github:17robots/dyn"]
version = "0.1.0-preview.39"
prerelease = true
strip_components = 1
bin_path = "bin"
[tools."github:17robots/dyn".platforms]
linux-x64 = { asset_pattern = "dyn-0.1.0-preview.39-linux-x86_64-glibc2.39.tar.gz", checksum = "sha256:4b15d092c88c293f79167a919295c536a748e0a64b32bf61c0bf85862a7597b5" }
macos-arm64 = { asset_pattern = "dyn-0.1.0-preview.39-macos-aarch64.tar.gz", checksum = "sha256:03dd555303c95548f73ad0ceb7faf720c6410569a9ac969a73e062d9d403ec26" }
windows-x64 = { asset_pattern = "dyn-0.1.0-preview.39-windows-x86_64.zip", checksum = "sha256:b7457f7b2363ebc36c0352615ea38a78768c8ebddf0f3ea493dd02fb7f155cec" }
# Windows on ARM runs the x64 compiler under emulation; DNA_WINDOWS_TARGET
# selects ARM64 output (scripts/windows_target.py).
windows-arm64 = { asset_pattern = "dyn-0.1.0-preview.39-windows-x86_64.zip", checksum = "sha256:b7457f7b2363ebc36c0352615ea38a78768c8ebddf0f3ea493dd02fb7f155cec" }

# Dependencies remain local; run `just deps` once after cloning.
[env]
# Native support archive first; system graphics/text and the SDK window bridge
# remain shared. No SDL dependency is built or linked.
DYN_LIBRARY_PATH = "{{config_root}}/build/deps/static:{{config_root}}/build/deps/install/lib"
LD_LIBRARY_PATH = "{{config_root}}/build/deps/install/lib"
