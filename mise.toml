# Verified preview 36 SDK assets; keep checksums and version together.
[tools."github:17robots/dyn"]
version = "0.1.0-preview.36"
prerelease = true
strip_components = 1
bin_path = "bin"
[tools."github:17robots/dyn".platforms]
linux-x64 = { asset_pattern = "dyn-0.1.0-preview.36-linux-x86_64-glibc2.39.tar.gz", checksum = "sha256:db2121a7880530197786acd248c1d9695cdd531bb331e007e2470cfefcbe564a" }
macos-arm64 = { asset_pattern = "dyn-0.1.0-preview.36-macos-aarch64.tar.gz", checksum = "sha256:990f074018e412c6ce64ab976ee992ba1817d47d3e51707bd93dffd2db7828d8" }
windows-x64 = { asset_pattern = "dyn-0.1.0-preview.36-windows-x86_64.zip", checksum = "sha256:056ea36ea6618934a3bf763f35cbdddfd5eaf72e6bd5f9fd7ceb18efe89b5642" }
# Windows on ARM runs the x64 compiler under emulation; DNA_WINDOWS_TARGET
# selects ARM64 output (scripts/windows_target.py).
windows-arm64 = { asset_pattern = "dyn-0.1.0-preview.36-windows-x86_64.zip", checksum = "sha256:056ea36ea6618934a3bf763f35cbdddfd5eaf72e6bd5f9fd7ceb18efe89b5642" }

# Dependencies remain local; run `just deps` once after cloning.
[env]
# Native support archive first; system graphics/text and the SDK window bridge
# remain shared. No SDL dependency is built or linked.
DYN_LIBRARY_PATH = "{{config_root}}/build/deps/static:{{config_root}}/build/deps/install/lib"
LD_LIBRARY_PATH = "{{config_root}}/build/deps/install/lib"
