# Copy this file, change colours, then :theme /path/to/your-theme.toml.
# Omitted colours inherit the selected base. Values use #RRGGBB.
base = "charcoal"
background = "#181818"
surface = "#202020"
border = "#414141"
line = "#1D1D1D"
text = "#D4D4D4"
muted = "#848484"
selection = "#354150"
cursor = "#8BA3BE"
syntax_comment = "#848C84"
syntax_string = "#A5B798"
syntax_keyword = "#AE9CBE"
syntax_function = "#97B2C8"
syntax_type = "#B7B395"
syntax_constant = "#C0A48C"
diagnostic_error = "#E66E6E"
diagnostic_warning = "#DCB45F"
# Syntax drawn in italics where the frontend can (the terminal; windows use
# one font face): any of comment string keyword function type constant.
# italic = "comment"

# Optional ANSI palette (applications using truecolour retain their own RGB).
terminal_black = "#1C1C1C"
terminal_red = "#B45F5F"
terminal_green = "#7A9B65"
terminal_yellow = "#B59B60"
terminal_blue = "#6D90B5"
terminal_magenta = "#A181B3"
terminal_cyan = "#65A3A3"
terminal_white = "#D4D4D4"
terminal_bright_black = "#707070"
terminal_bright_red = "#D98888"
terminal_bright_green = "#A5C18B"
terminal_bright_yellow = "#D2BD82"
terminal_bright_blue = "#95B4D7"
terminal_bright_magenta = "#C2A1D2"
terminal_bright_cyan = "#92C5C5"
terminal_bright_white = "#F0F0F0"
