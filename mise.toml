[tools]
"github:17robots/dyn" = "0.1.0-preview.14"

# Dependencies remain local; run `just deps` once after cloning.
[env]
# build/deps/static comes first: `dyn build src` and `dyn run src` link SDL3,
# SDL_ttf and the DNA native library statically, so the binary runs from any
# directory without these libraries installed.
DYN_LIBRARY_PATH = "{{config_root}}/build/deps/static:{{config_root}}/build/deps/install/lib"
LD_LIBRARY_PATH = "{{config_root}}/build/deps/install/lib"
